<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f97316" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Logo Emblem Icon -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Rounded Shield Background -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#primaryGrad)" />
    
    <!-- Modern Bus Silhouette SVG -->
    <path d="M16 44 L16 26 C16 20 20 18 32 18 C44 18 48 20 48 26 L48 44 C48 47 46 48 43 48 L41 48 L41 52 C41 53 40 54 39 54 L36 54 C35 54 34 53 34 52 L34 48 L30 48 L30 52 C30 53 29 54 28 54 L25 54 C24 54 23 53 23 52 L23 48 L21 48 C18 48 16 47 16 44 Z" fill="#ffffff" />
    
    <!-- Windshield -->
    <path d="M20 24 L44 24 C45 24 45.5 24.5 45 26 L43.5 32 C43 33 42 34 40 34 L24 34 C22 34 21 33 20.5 32 L19 26 C18.5 24.5 19 24 20 24 Z" fill="#0f172a" opacity="0.9" />
    
    <!-- Headlights -->
    <circle cx="21" cy="42" r="2.5" fill="url(#goldGrad)" />
    <circle cx="43" cy="42" r="2.5" fill="url(#goldGrad)" />
    
    <!-- Grill line -->
    <line x1="26" y1="42" x2="38" y2="42" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(86, 26)">
    <!-- Jayambe Text -->
    <text x="0" y="16" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      JAYAMBE
    </text>
    
    <!-- Travels Text with Saffron gradient -->
    <text x="122" y="16" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#f97316" letter-spacing="-0.5">
      TRAVELS
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="1" y="32" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="1.5">
      GUJARAT STATE DELUXE SERVICE
    </text>
  </g>
</svg>
